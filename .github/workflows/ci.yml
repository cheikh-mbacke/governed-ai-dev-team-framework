name: Governed CI

on:
  push:
    branches:
      - main
      - "wu/**"
      - "ai-run/**"
      - "integration/**"
      - "hotfix/**"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-policy:
    name: git-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/ai-team/check_git_policy.py --ci

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  compatibility-tests:
    name: compatibility-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  governance-validation:
    name: governance-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt ruff
      - run: python -m ruff check scripts/
      - run: python scripts/ai-team/validate.py
      - run: python scripts/ai-team/check_release_matrix.py
      - run: python scripts/ai-team/sync_source_manifest.py --check
