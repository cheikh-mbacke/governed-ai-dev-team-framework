policy: ui_ux_strategy
version: "1.2.0"

applies_to:
  work_unit_zones: [frontend, fullstack, mobile]

principle: >
  A Work Unit is not "done" because it renders something. It's done when a
  real user, on a real device, in a degraded state (empty, slow, wrong),
  can still understand where they are and what to do - and when someone
  who cannot see a screen or use a mouse can still complete the task.
  When a human provides an authoritative mockup, that reference is a product
  contract: agents must reproduce it, not silently replace it with their own
  aesthetic direction.

11_design_authority:
  principle: >
    Design Authority turns mockups, captures, wireframes and tokens into
    versioned, hashed, verifiable Design Contracts bound to Work Units.
  design_modes:
    conform: reproduce an authoritative Design Contract; no creative override
    adapt: adapt only inside explicitly declared free zones and tolerances
    create: invent a direction only when no authoritative design covers the WU
    maintain: stay consistent with the existing design system and UI
    explore: propose alternatives without treating one as the final decision
  authority_levels:
    authoritative: binding; only an authorized human may assign this level
    advisory: guidance that must not auto-block acceptance
    inspiration_only: non-binding inspiration
    deprecated: must not be used for new work
  rules:
    - an_authoritative_reference_wins_over_agent_creativity_by_default
    - agents_must_not_silently_improve_an_authoritative_mockup
    - missing_decisions_produce_clarification_or_human_decision_requests
    - creativity_applies_only_to_explicit_free_zones
    - frontend-design_creative_procedure_is_only_for_create_or_explore
    - implement-approved-design_is_the_primary_procedure_for_conform
    - visual_qa_must_be_independent_from_the_implementer
    - advisory_references_never_auto_block
    - blocking_authoritative_divergences_block_progress
    - design_system_inventory_must_be_searched_before_creating_components
    - mockup_vs_design_system_conflicts_escalate_unless_precedence_decides
  visual_conformance:
    levels: [exact, tolerant_visual, structural, behavioral, advisory]
    default_level: tolerant_visual
    tolerances_must_come_from_design_contract: true
    captures_must_bind: [route, state, viewport, reference_id, commit_sha]

1_discovery:
  required_before_implementation:
    - target_users
    - primary_goal
    - context_of_use
    - priority_actions
    - target_devices

2_information_architecture:
  requirements:
    - navigation_and_menus_are_explicit_in_the_design_or_spec
    - clear_titles_and_sections
    - search_or_filters_when_the_content_set_warrants_it
    - visual_hierarchy_reflects_actual_priority
    - the_primary_user_journey_is_traceable_end_to_end
    - the_most_important_content_is_immediately_visible

3_components:
  principle: >
    Every interactive component (button, form field, list/table, card, tab,
    dropdown, modal, notification, loading indicator, error/confirmation
    message, pagination) must have one clear function and behave the same
    way everywhere it appears in this product.
  reviewer_check: >
    Flag a component whose behavior differs from its other uses in the
    same product without a documented reason.

4_visual_presentation:
  requirements:
    - color_typography_spacing_icons_are_consistent_with_the_rest_of_the_product
    - grid_and_alignment_are_deliberate_not_accidental
    - every_interactive_element_defines_its_states: [normal, hover, selected, disabled, error]
    - contrast_and_size_prioritize_legibility_over_decoration

5_usability_principles:
  checklist:
    - the_primary_action_is_visually_unambiguous
    - wording_is_simple_and_precise
    - the_number_of_steps_is_minimized
    - conventions_are_consistent_with_the_rest_of_the_product
    - every_user_action_produces_visible_feedback
    - errors_are_prevented_where_feasible_not_just_caught_after
    - the_user_can_undo_or_correct_a_mistake
    - only_necessary_information_is_requested

6_required_states:
  states:
    - initial_state
    - loading
    - content_available
    - no_results_empty_state
    - error
    - connection_interrupted
    - access_denied
    - action_succeeded
    - content_very_short_or_very_long
  qa_instruction: >
    For each state above that applies to this Work Unit, verify it was
    actually exercised (observed, not asserted) before marking QA passed.
  writing_note: >
    For empty/error/access-denied states, copy is part of the interface.

7_accessibility:
  requirements:
    - operable_by_keyboard_alone_with_a_visible_focus_indicator
    - compatible_with_a_screen_reader: [explicit_labels, meaningful_reading_order]
    - never_relies_on_color_alone_to_convey_meaning
    - usable_at_significant_zoom_levels
    - sufficient_contrast
    - click_or_tap_targets_are_large_enough
    - respects_prefers_reduced_motion
  verification: >
    required_verification.accessibility_check should be true for UI Work Units
    unless explicitly waived. Prefer webapp-testing evidence.

8_responsive_and_devices:
  requirements:
    - mobile_navigation_works_without_relying_on_a_wide_viewport
    - text_and_touch_targets_are_appropriately_sized_on_small_screens
    - tables_have_a_defined_small_screen_behavior_not_silent_overflow
    - forms_remain_usable_on_a_small_screen
    - touch_interactions_are_considered_where_target_devices_include_touch
    - both_portrait_and_landscape_are_considered_when_relevant
  scope_note: >
    Explicit "desktop only" or "mobile only" decisions win over defaults.

9_performance_and_trust:
  requirements:
    - images_and_animations_are_reasonably_optimized
    - long_running_operations_show_progress_or_a_clear_waiting_state
    - personal_data_handling_follows_security-and-compliance/
    - an_irreversible_action_requires_confirmation
    - a_requested_permission_or_piece_of_information_explains_why_its_needed

10_formative_human_review:
  principle: >
    A human visual checkpoint is a non-blocking opportunity to observe and
    comment on a coherent UI revision. It is not an approval gate and it is
    distinct from final human acceptance at G4.
  select_during_compilation_when:
    - first_testable_slice_of_a_surface
    - new_user_journey
    - information_architecture_change
    - critical_user_journey
    - high_product_ambiguity
    - material_change_to_a_previously_reviewed_surface
  normally_skip_when:
    - invisible_refactor
    - technical_fix_with_sufficient_automated_coverage
    - isolated_design_token_change
    - no_user_perceptible_effect
  timing: >
    Emit after independent QA has observed the applicable required states on
    an exact commit, while remediation is still local.
  package: >
    Prepare a short human-executable package containing the URL or command,
    exact commit, preconditions, data, scenarios and evidence references.
  asynchronous_feedback: >
    Feedback may arrive after execution has continued. Record it against the
    observed commit, then reconcile before the next affected dispatch.

definition_of_done_addition:
  # UI Work Units also require Design Authority checks in conform mode:
  # authoritative refs not ignored; required screens/states/viewports verified
  # on the delivered commit; no blocking divergence; a11y verified.

precedence_over_frontend_design_skill:
  - conflict: >
      frontend-design says to invent the subject/audience/goal yourself
      if a brief doesn't specify one ("pin it yourself").
    resolution: >
      Never invent target users, primary goal, or context of use (see
      1_discovery). Raise a CLARIFICATION_REQUEST instead.
  - conflict: >
      frontend-design treats "responsive down to mobile" as an
      unconditional quality floor.
    resolution: >
      Target devices are whatever 1_discovery.target_devices says.
  - conflict: >
      frontend-design encourages distinctive creative direction by default.
    resolution: >
      Under design_mode conform or adapt, Design Authority wins. Creative
      defaults apply only in create/explore, or inside explicit free_zones.
