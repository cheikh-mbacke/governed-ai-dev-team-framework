project:
  id: golden-fixture-project
  name: Golden Fixture Project
  repository_kind: existing_or_greenfield_project
  primary_language: python
  package_manager: pip

communication:
  language: français

autonomy:
  level: 3

paths:
  product_docs: docs/product
  source_roots:
    - scripts
  test_roots:
    - tests
  config_roots:
    - .ai-team
    - .cursor

commands:
  setup: "python -m pip install -r requirements.txt"
  build: null
  lint: "python -m ruff check scripts/"
  typecheck: null
  unit_test: "python -m pytest tests/ -q"
  integration_test: null
  e2e_test: null

runtime_environments:
  development:
    protected: false
  test:
    protected: false
  staging:
    protected: true
  production:
    protected: true

release:
  protected_branch: main
  production_requires_g3: true
  auto_push_working_branches: false

human_authorities:
  product: fixture-operator
  engineering_constitution: fixture-operator
  production_release: fixture-operator
  final_acceptance: fixture-operator

setup_status:
  template: false
  note: "Golden fixture — sanitized representative Project Profile for schema validation."
