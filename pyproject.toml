[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-ai-dev-team-framework"
version = "0.7.0"
description = "Human-governed multi-agent software development framework for Cursor UI and CLI"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
src = ["scripts", "src", "adapters"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/ai-team/*.py" = ["E402"]
"tools/*.py" = ["E402"]
