id: DEC-GIT-GOVERNANCE-20260831
question: "Faut-il appliquer les recommandations de l'audit Git et comment qualifier la rupture d'historique 0.4.x ?"
why_human_authority_is_required: "La stratégie de versionnement, la protection des branches et l'interprétation d'une rupture historique relèvent de l'autorité humaine d'ingénierie."
source_investigation:
  - "Audit local et GitHub du 31 août 2026"
  - ".ai-team/constitution/95-git-release-policy.yaml"
  - "Historique et références Git origin/main, origin/release/0.4.0, v0.4.0 et v0.6.0"
options:
  - id: apply_recommendations
    description: "Implémenter la politique cible et documenter rétrospectivement la rupture volontaire."
  - id: retain_current_state
    description: "Conserver les contrôles déclaratifs sans enforcement supplémentaire."
impact_by_option:
  apply_recommendations: "Ajoute CI, contrôles, documentation et exigences de protection GitHub sans réécrire l'historique."
  retain_current_state: "Maintient le risque de contournement, de release incohérente et de régression non bloquée."
status: decided
decision:
  selected_option: apply_recommendations
  scope: "Toutes les recommandations de l'audit, avec conservation intacte des historiques et tags existants."
  clarification: "La rupture entre release/0.4.0 et le main courant était volontaire, causée par un blocage technique ; le manquement porte sur sa non-documentation."
