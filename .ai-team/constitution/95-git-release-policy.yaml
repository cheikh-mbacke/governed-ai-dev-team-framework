policy: git_release_rollback
version: "1.0.0"
git:
  developer_uses_isolated_working_branch_or_worktree: true
  developer_direct_protected_branch_write: false
  merge_requires_definition_of_done_and_risk_approvals: true
  shared_contract_or_structural_migration_requires_impact_analysis: true
  candidate_commit_or_artifact_must_be_stably_identified_in_evidence: true
release:
  release_candidate_contains: [commits, migrations, evidence, open_findings, approval_status]
  production_deployment_gate: G3
  lower_environments_may_be_automated: true
rollback:
  significant_risk_requires_rollback_or_restore_plan_before_release: true
  automatic_rollback_allowed_only_for_pre_authorized_observable_conditions: true
  post_rollback_project_state_records: [cause, restored_version, remediation_work_units]
