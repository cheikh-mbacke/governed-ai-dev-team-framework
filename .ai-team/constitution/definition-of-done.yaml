policy: definition_of_done
version: "1.0.0"
required_when_applicable:
  - implementation_matches_scope_and_contracts
  - required_tests_written_executed_and_linked_to_code_revision
  - build_lint_typecheck_and_technical_validations_pass
  - acceptance_criteria_verified_or_evidence_prepared_for_human_acceptance
  - required_review_completed
  - impacted_documentation_and_contracts_updated
  - human_acceptance_scenarios_prepared_when_required
  - no_critical_blocker_defect_or_audit_finding_without_explicit_decision
  - release_status_and_rollback_plan_available_when_contributing_to_release
transition_rule: "A Work Unit is not DONE merely because code compiles or an implementing agent says it is complete."
