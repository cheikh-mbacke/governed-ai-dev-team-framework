policy: skills_permissions_least_privilege
version: "1.0.0"
skill_statuses:
  approved: "May be used by explicitly authorized roles/resources."
  restricted: "Requires a condition, environment restriction or human approval."
  unknown: "May be proposed but not used before approval."
roles:
  product-analyst:
    allow: [read_authoritative_sources, read_repository, propose_requirements, propose_acceptance, emit_questions]
    deny: [product_decision, product_code_write, production_deploy]
  architect:
    allow: [read_repository, analyze_architecture, propose_architecture, propose_contract_change, impact_analysis]
    deny: [product_decision, production_deploy, silent_contract_change]
  backend-developer:
    allow: [read, write_working_branch, run_nonproduction_tests, produce_evidence]
    deny: [direct_protected_branch_merge, production_deploy, product_decision]
  frontend-developer:
    allow: [read, write_working_branch, run_nonproduction_tests, produce_evidence]
    deny: [direct_protected_branch_merge, production_deploy, product_decision]
  qa-test:
    allow: [read, write_tests_and_qa_artifacts, run_nonproduction_tests, produce_defects, produce_evidence]
    deny: [production_deploy, protected_branch_bypass, product_decision]
  code-reviewer:
    allow: [read_diff, read_repository, read_evidence, approve_or_reject, produce_findings]
    deny: [modify_evaluated_code, production_deploy]
  security-reviewer:
    allow: [read_repository, read_evidence, security_assessment, produce_findings]
    deny: [modify_evaluated_code, production_deploy]
  auditor:
    allow: [read_repository, read_evidence, read_runtime_evidence, produce_audit_findings]
    deny: [remediate_during_measurement, production_deploy]
  release-agent:
    allow: [read_approved_content, assemble_release_candidate, prepare_deployment_plan, prepare_rollback_plan]
    deny: [bypass_gates, autonomous_production_deploy_in_reference_profile]
high_impact_actions:
  require_explicit_human_authorization:
    - permission_or_iam_change
    - secret_or_credential_change
    - critical_infrastructure_change
    - production_data_mutation
    - production_deployment
logging:
  sensitive_access_and_action_must_be_traceable_to_project_state: true
