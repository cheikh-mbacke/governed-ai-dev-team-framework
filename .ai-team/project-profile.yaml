# This file is filled in once, right after installation, before the first
# /compile-project. Nothing below is example content to delete — every field
# left null/empty/unspecified is read literally by the orchestrator and the
# validate.py script, and stays flagged until you fill it.
#
# Example of a filled-in profile (Node/TypeScript project):
#
# project:
#   id: checkout-service
#   name: Checkout Service
#   repository_kind: existing
#   primary_language: typescript
#   package_manager: pnpm
# paths:
#   product_docs: docs/product
#   source_roots: [src]
#   test_roots: [tests]
#   config_roots: [config]
# commands:
#   setup: "pnpm install"
#   build: "pnpm build"
#   lint: "pnpm lint"
#   typecheck: "pnpm typecheck"
#   unit_test: "pnpm test:unit"
#   integration_test: "pnpm test:integration"
#   e2e_test: "pnpm test:e2e"
# human_authorities:
#   product: alice
#   engineering_constitution: alice
#   production_release: bob
#   final_acceptance: alice
# communication:
#   language: français

project:
  id: framework-template
  name: Governed AI Development Team Framework
  repository_kind: framework_template
  primary_language: unknown
  package_manager: unknown

communication:
  # Free text: a language name ("français", "español", "日本語") or an
  # ISO code ("fr", "es", "ja"). Applies to how agents talk to you and to
  # human-facing prose they write (Work Unit titles/objectives, questions,
  # explanations). It never changes YAML keys, enum values (e.g.
  # `status: ready`), file paths, commands, or code — those stay in their
  # defined form so the schemas and scripts in this framework keep working
  # regardless of this setting.
  language: english

autonomy:
  level: 2

paths:
  product_docs: docs/product
  source_roots: []
  test_roots: []
  config_roots: []

commands:
  setup: null
  build: null
  lint: null
  typecheck: null
  unit_test: null
  integration_test: null
  e2e_test: null

runtime_environments:
  development:
    protected: false
  test:
    protected: false
  staging:
    protected: true
  production:
    protected: true

release:
  protected_branch: main
  production_requires_g3: true

human_authorities:
  product: unspecified
  engineering_constitution: unspecified
  production_release: unspecified
  final_acceptance: unspecified

setup_status:
  template: true
  note: "The installer rewrites project.id, project.name and template=false. Fill repository-specific commands, paths and human authorities before production use."
