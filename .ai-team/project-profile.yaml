project:
  id: framework-renov
  name: Framework Renov
  repository_kind: framework_source
  primary_language: python
  package_manager: pip
communication:
  language: français
autonomy:
  # Named preset is authoritative (Document 6 §4). Legacy level is kept only
  # for schema compatibility; resolve_project_preset never lets new code read
  # level directly when preset is present.
  preset: supervised_copilots
  level: 3
paths:
  product_docs: docs/product
  source_roots:
  - scripts
  - .cursor/hooks
  test_roots:
  - tests
  config_roots:
  - .ai-team
  - .cursor
commands:
  setup: python -m pip install -r requirements.txt
  build: null
  lint: python -m ruff check scripts/
  typecheck: null
  unit_test: python -m pytest tests/ -q
  integration_test: null
  e2e_test: null
runtime_environments:
  development:
    protected: false
  test:
    protected: false
  staging:
    protected: true
  production:
    protected: true
release:
  protected_branch: main
  production_requires_g3: true
  auto_push_working_branches: false
human_authorities:
  product: cheikh MBACKE
  engineering_constitution: cheikh MBACKE
  production_release: cheikh MBACKE
  final_acceptance: cheikh MBACKE
setup_status:
  template: false
  cursor_compile_opt_in: true
  note: 'Dépôt source/distribution du framework — pas une cible installée. Seul
    framework-version.json décrit le payload ; pas d installation-record.json ici.
    Gouvernance de refonte (WU, gates) = métadonnées projet de développement, distinctes
    du cycle client post-install. sync_source_manifest.py regénère le manifeste source.'
active_adapter_id: cursor
