id: WU-GIT-GOVERNANCE
title: "Rendre la gouvernance Git et les releases effectivement contraignantes"
objective:
  result: "La politique Git validée est documentée, testée en CI et contrôlable avant toute fusion ou release."
  rationale: "L'audit du 31 août 2026 a montré un écart important entre les règles déclarées et leur application locale/GitHub."
scope:
  include:
    - .github/
    - .ai-team/constitution/95-git-release-policy.yaml
    - .ai-team/state/project-state.yaml
    - .ai-team/decisions/
    - .ai-team/events/
    - docs/operator/
    - scripts/ai-team/
    - tests/
    - VERSIONING.md
    - CONTRIBUTING.md
    - CHANGELOG.md
    - .github/CODEOWNERS
    - .mailmap
  exclude:
    - "Réécriture ou raccord artificiel des historiques Git existants"
    - "Déplacement ou suppression des tags v0.4.0 et v0.6.0"
    - "Changement fonctionnel du produit hors des contrôles nécessaires à la CI"
zone:
  area: infra
  capabilities:
    - git-governance
    - continuous-integration
    - release-integrity
  components:
    - github-actions
    - governance-policy
    - release-tooling
expected_behavior: "main et les tags de release ne peuvent être promus qu'après validation automatisée d'une révision stable, traçable et cohérente avec la version déclarée."
applicable_rules_requirements:
  - "Constitution 95 — Git, release et rollback"
  - "Definition of Done"
  - "Décision humaine DEC-GIT-GOVERNANCE-20260831"
acceptance_criteria:
  - "La stratégie de branches, commits, fusion, version SemVer, tags et maintenance est normative et non ambiguë"
  - "Une CI présente sur main vérifie tests, lint, gouvernance Git et cohérence des versions"
  - "Les messages de commit et noms de branches gouvernés sont vérifiés automatiquement"
  - "Un tag vX.Y.Z est refusé si la version du commit ou les artefacts de release sont incohérents"
  - "La rupture historique volontaire entre 0.4.x et le nouveau main est documentée sans réécriture"
  - "Les protections GitHub requises et leur procédure d'activation sont documentées"
  - "Les validations nécessaires à la protection de main passent sur le SHA candidat"
dependencies: []
risk:
  class: high
  reasons:
    - "Les règles modifient le chemin de contribution et de release"
    - "Une CI incorrecte peut bloquer toutes les fusions"
    - "Les métadonnées de version actuelles contiennent des incohérences historiques"
required_verification:
  unit_tests: true
  integration_tests: true
  contract_tests: true
  e2e: false
  qa: true
  review: true
  security_review: true
  audit: true
  human_acceptance: true
context_package_ref: null
status: in_progress
