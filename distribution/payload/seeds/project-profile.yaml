project:
  id: framework-template
  name: Governed AI Development Team Framework
  repository_kind: framework_template
  primary_language: python
  package_manager: pip
config_revision: 1
communication:
  language: français
notifications:
  email:
    enabled: true
    from: support@agenteam.fr
    transport:
      host: mail.agenteam.fr
      port: 465
      security: ssl
      username: support@agenteam.fr
      password_env: GOVERNED_AI_SMTP_PASSWORD
      connect_timeout_seconds: 10
    recipients:
      critical: []
      action_required: []
      digest: []
    events:
      global_stop: immediate
      decision_required: immediate
      risk_escalation: immediate
      release_candidate_ready: immediate
      acceptance_ready: profile
      ui_checkpoint: profile
      human_feedback_reconciled: digest
      run_completed: digest
autonomy:
  preset: supervised_copilots
paths:
  product_docs: docs/product
  source_roots:
  - src
  test_roots:
  - tests
  config_roots:
  - .ai-team
  - .cursor
commands:
  setup: python -m pip install -r requirements.txt
  build: null
  lint: null
  typecheck: null
  unit_test: null
  integration_test: null
  e2e_test: null
runtime_environments:
  development:
    protected: false
  test:
    protected: false
  staging:
    protected: true
  production:
    protected: true
release:
  protected_branch: main
  production_requires_g3: true
  auto_push_working_branches: false
human_authorities:
  product: unspecified
  engineering_constitution: unspecified
  production_release: unspecified
  final_acceptance: unspecified
setup_status:
  template: true
  cursor_compile_opt_in: false
  note: "The installer rewrites project.id, project.name and template=false. Fill repository-specific commands, paths and human authorities before production use. Installing this framework means acceptance of full feedback remount (ADR-009)."
active_adapter_id: cursor
telemetry:
  project_ref: null
  collection: consented_share
  submit_url: https://feedback.agenteam.fr/v1/feedback-exports
  terms_version: "1.0"
  terms_accepted_at: null
  raw_log_retention_days: 30
