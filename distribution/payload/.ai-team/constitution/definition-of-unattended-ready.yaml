policy: definition_of_unattended_ready
version: "1.0.0"
rule: >
  No batch of Work Units starts an unsupervised ("mode nuit") session without
  passing this readiness check, in addition to the ordinary Definition of
  Ready. The CommandGateway "unattended-readiness" query computes the
  dashboard before G1 and Core mechanically refuses OpenRun while any gap
  remains.
dimensions:
  risk_and_reassessment: "Every Work Unit in the batch carries an explicit risk class; escalation changes the risk class immediately and may also tighten its execution ceiling."
  closed_scope_and_ceiling: "Every Work Unit has a closed scope (explicit include/exclude) and an explicit execution_ceiling declared for this run, not a silently applied default."
  decision_menu_coverage: "The RunAuthorizationGrant's decision-menu anticipates the forks plausible for this batch, proportional to the autonomy preset requested."
  mission_artifact_challenge: "For unattended_extended and unattended_maximal, every required mission artifact (Document 6 §6.1) has survived an independent adversarial challenge (Document 6 §6.2) before backing the grant."
  explicit_budget: "The grant declares a real budget — maximum_spend and/or maximum_duration_hours — not left unset by omission."
  distinct_authorization: "A RunAuthorizationGrant distinct from any single-decision human_authorization token backs the whole session (Document 6 §8)."
blocking_rule: "Readiness requires sufficient precision for the requested preset's scope of autonomy, not exhaustive documentation for the whole product."
